<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Revolta Química</title>

    <link rel="stylesheet" type="text/css" href="./styles/style.css">
    <link rel="icon" href="./assets/favicon.ico">

    <script src="./libraries/p5.min.js"></script>
    <script src="./libraries/p5.sound.min.js"></script>
  </head>

  <body>
    <div class="JOGO" id="jogo">
      <div class="title">
        <div class="lado" id="lado"></div>
        <div class="exit" id="botaosair" onclick="sairJogo();">✖</div>
      </div>
      <div class="container">
        <div class="ladoVertical" id="ladoEsq"></div>
        <div class="container-canvas" id="container-canvas">
          <div class="acima" id="personagem-atacar-animacao"></div>
        </div>
        <div class="ladoVertical" id="ladoDir"></div>
      </div>
    </div>
    <p id="estadoCarregamento">Carregando Revolta Química...</p>
    
    <script src="./src/core/cache.js"></script>
    <script src="./src/core/musicManager.js"></script>

    <script src="./src/Classes.js"></script>

    <script>
      (function() {
        var isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        if (!isTouchDevice) return;

        var botoesDiv = document.createElement('div');
        botoesDiv.className = 'botoes';

        var dirs = [
          { cls: 'botao-left',  down: irEsquerda,  up: NAOirEsquerda },
          { cls: 'botao-up',    down: irCima,      up: NAOirCima },
          { cls: 'botao-down',  down: irBaixo,     up: NAOirBaixo },
          { cls: 'botao-right', down: irDireita,   up: NAOirDireita }
        ];

        dirs.forEach(function(d) {
          var btn = document.createElement('button');
          btn.className = 'botao ' + d.cls;

          btn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            btn.classList.add('active');
            d.down();
          }, { passive: false });

          btn.addEventListener('touchend', function(e) {
            e.preventDefault();
            btn.classList.remove('active');
            d.up();
          }, { passive: false });

          btn.addEventListener('touchcancel', function(e) {
            btn.classList.remove('active');
            d.up();
          }, { passive: false });

          botoesDiv.appendChild(btn);
        });

        document.getElementById('jogo').appendChild(botoesDiv);
      })();
    </script>
    <script src="./src/Paginas.js"></script>
    <script src="./src/Ataques.js"></script>   
    <script src="./src/Descarga.js"></script>   
    <script src="./src/Estequiometria.js"></script>   
    <script src="./src/Controle.js"></script>
    <script src="./src/Funcoes.js"></script>
    <script src="./src/Principal.js"></script>
    
  </body>
</html>
